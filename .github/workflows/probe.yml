name: Build LiveCaptionsProbe

on:
  push:
    paths: ["diagnostics/**", ".github/workflows/probe.yml"]
  pull_request:
    paths: ["diagnostics/**", ".github/workflows/probe.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish (framework-dependent, single file)
        run: dotnet publish diagnostics/LiveCaptionsProbe -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out/probe
      - name: Smoke test (no Live Captions on CI, so it should wait and then exit cleanly)
        run: out/probe/LiveCaptionsProbe.exe --seconds 3 --no-log
      - uses: actions/upload-artifact@v4
        with:
          name: LiveCaptionsProbe-win-x64
          path: out/probe/LiveCaptionsProbe.exe
